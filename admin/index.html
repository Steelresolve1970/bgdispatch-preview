<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex"><link rel="canonical" href="https://blackandgolddispatch.com/admin/"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="B&G Admin">
<meta name="theme-color" content="#111111">
<title>Owner Dashboard - Black &amp; Gold Dispatch</title>
<style>
:root{--bg:#0f0f10;--card:#1a1a1c;--line:#2c2c30;--text:#f2f2f2;--mute:#a8a8ad;--gold:#ffb612;--green:#2fbf71;--yellow:#f2c94c;--red:#ff5a52}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:3px solid var(--gold);padding:10px 14px calc(8px);padding-top:max(10px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1100px;margin:0 auto}
h1{font-size:18px;margin:0;color:var(--gold);letter-spacing:.2px}
.sub{font-size:13px;color:var(--mute)}
button,.btn{font:inherit;font-size:15px;border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block;min-height:40px}
button.primary{background:var(--gold);color:#000;font-weight:600}
button.danger{border-color:var(--red);color:var(--red)}
nav.jump{display:flex;gap:8px;overflow-x:auto;max-width:1100px;margin:8px auto 0;padding-bottom:2px;-webkit-overflow-scrolling:touch}
nav.jump a{flex:0 0 auto;color:var(--text);text-decoration:none;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
main{max-width:1100px;margin:0 auto;padding:14px}
section{margin:0 0 22px;scroll-margin-top:110px}
h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--mute)}
.stat .d{font-size:12px;color:var(--mute);margin-top:4px}
.na{color:var(--mute);font-style:italic;font-size:15px}
ul.check{list-style:none;margin:0;padding:0}
ul.check li{display:flex;gap:10px;padding:11px 2px;border-top:1px solid var(--line);align-items:flex-start}
ul.check li:first-child{border-top:0}
.dot{flex:0 0 auto;width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--mute)}
.dot.done,.dot.green{background:var(--green)}.dot.todo,.dot.red{background:var(--red)}.dot.warn,.dot.yellow{background:var(--yellow)}
.ct{font-weight:600}.cd{font-size:14px;color:var(--mute)}
.ct a{color:var(--gold)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#000}
.pill.green{background:var(--green)}.pill.yellow{background:var(--yellow)}.pill.red{background:var(--red)}.pill.gray{background:#666;color:#fff}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar .b{width:100%;background:var(--gold);border-radius:6px 6px 0 0;min-height:2px}
.bar .v{font-size:12px;margin-bottom:3px}
.bar .x{font-size:11px;color:var(--mute);margin-top:4px;white-space:nowrap}
.bar.today .b{background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;border-top:0}
td.num,th.num{text-align:right}
.toggle{display:flex;gap:6px;margin-top:6px}
.toggle button{min-height:34px;padding:4px 12px;font-size:14px}
.toggle button.on{background:var(--gold);color:#000}
.muted{color:var(--mute);font-size:13px}
form.ad label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
form.ad input,form.ad textarea{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#0b0b0c;color:var(--text)}
form.ad .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.ad .chk{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--text)}
form.ad .chk input{width:24px;height:24px}
.err{color:var(--red);font-size:14px;margin-top:8px}
.adrow{border-top:1px solid var(--line);padding:12px 0}
.adrow:first-child{border-top:0}
.adrow .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.inq{border-top:1px solid var(--line);padding:12px 0}.inq:first-child{border-top:0}
.inq p{margin:6px 0;white-space:pre-wrap;word-break:break-word}
#gate{display:none}
.loading{color:var(--mute);padding:30px 0;text-align:center}
a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>Owner Dashboard</h1><div class="sub" id="updated">Loading…</div></div>
    <button id="refresh" type="button">Refresh</button>
  </div>
  <nav class="jump"><a href="#today">Today</a><a href="#numbers">Numbers</a><a href="#health">Site health</a><a href="#ads">Ads</a><a href="/bgdispatch-preview/" target="_blank" rel="noopener">Open site</a></nav>
</header>
<main>
  <div id="gate" class="card"></div>
  <div id="app"><div class="loading">Loading your dashboard…</div></div>
</main>
<script>
(function(){
'use strict';
var TZ='America/New_York', D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(x){return x==null?'—':Number(x).toLocaleString('en-US');}
function money(x){return x==null||x===''?'':'$'+Number(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function when(t){if(!t)return 'unknown';var d=new Date(t);return d.toLocaleString('en-US',{timeZone:TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' ET';}
function ago(t){if(!t)return 'unknown';var m=Math.round((Date.now()-t)/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';var h=Math.round(m/60);if(h<48)return h+' hour'+(h>1?'s':'')+' ago';return Math.round(h/24)+' days ago';}
function dayLabel(s){var p=s.split('-');var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));return d.toLocaleDateString('en-US',{timeZone:'UTC',weekday:'short'})+' '+(+p[1])+'/'+(+p[2]);}
function fmtDate(s){if(!s)return '';var p=s.split('-');return (+p[1])+'/'+(+p[2])+'/'+p[0];}
function api(path,body){
  var o={credentials:'same-origin',headers:{'accept':'application/json'}};
  if(body){o.method='POST';o.headers['content-type']='application/json';o.headers['x-bgd']='1';o.body=JSON.stringify(body);}
  return fetch('/api/admin/'+path,o).then(function(r){return r.json().catch(function(){return {ok:false,error:'bad_response'};}).then(function(j){j._status=r.status;return j;});});
}
function stat(label,val,detail){return '<div class="stat"><div class="n">'+val+'</div><div class="l">'+esc(label)+'</div>'+(detail?'<div class="d">'+detail+'</div>':'')+'</div>';}

function load(){
  document.getElementById('updated').textContent='Loading…';
  api('summary').then(function(d){
    if(!d.ok){return gate(d);}
    D=d; render();
  }).catch(function(){document.getElementById('updated').textContent='Could not reach the site. Check your connection and tap Refresh.';});
}
function gate(d){
  var g=document.getElementById('gate');g.style.display='block';document.getElementById('app').innerHTML='';
  document.getElementById('updated').textContent='';
  g.innerHTML=d.error==='not_allowed'?'<h2>Private page</h2><p>This page is only for the site owner.</p>':
    (d.setup===false?'<h2>Almost ready</h2><p>The private sign-in for this page is still being switched on.</p>':'<h2>Please sign in again</h2><p>Your sign-in has ended. Tap below to get a new code by email.</p><p><a class="btn" href="/bgdispatch-preview/admin/?r='+Date.now()+'">Sign in</a></p>');
}

function render(){
  document.getElementById('gate').style.display='none';
  document.getElementById('updated').textContent='Updated '+when(D.now);
  var h='';
  // ---------- TODAY ----------
  var todo=D.checklist.filter(function(c){return c.status!=='done';}), done=D.checklist.filter(function(c){return c.status==='done';});
  h+='<section id="today"><h2>Today\'s checklist</h2><div class="card">';
  h+= todo.length? '<p style="margin:0 0 6px"><b>'+todo.length+' thing'+(todo.length>1?'s':'')+' for you</b></p>' : '<p style="margin:0 0 6px"><b>Nothing needs you right now.</b></p>';
  h+='<ul class="check">'+todo.map(item).join('')+'</ul>';
  if(done.length){h+='<details style="margin-top:8px"><summary class="muted" style="cursor:pointer;font-size:15px">'+done.length+' things handled or fine (tap to see)</summary><ul class="check">'+done.map(item).join('')+'</ul></details>';}
  h+='</div></section>';
  // ---------- NUMBERS ----------
  h+='<section id="numbers"><h2>Numbers</h2>';
  var A=D.analytics;
  h+='<div class="card"><div class="ct">Website visitors</div>';
  if(A&&A.ok&&A.days&&A.days.length){
    var days=A.days, td=days[days.length-1], yd=days[days.length-2]||{}, wk=days.slice(-7), sumV=0,sumP=0; wk.forEach(function(x){sumV+=x.visits;sumP+=x.views;});
    h+='<div class="grid" style="margin-top:10px">'+stat('Visits today',n(td.visits),'Page views '+n(td.views))+stat('Visits yesterday',n(yd.visits),'Page views '+n(yd.views))+stat('Visits, last 7 days',n(sumV),'Page views '+n(sumP))+stat('Avg visits per day',n(Math.round(sumV/7)),'last 7 days')+'</div>';
    h+='<div class="toggle" role="group" aria-label="Chart shows"><button type="button" data-m="visits" class="on">Visits</button><button type="button" data-m="views">Page views</button></div>';
    h+='<div id="chart"></div>';
    h+='<p class="muted">'+esc(A.note||'')+' Days run midnight to midnight Eastern. Numbers refresh about every 11 minutes.</p>';
    if(A.top_referrers&&A.top_referrers.length){h+='<details><summary class="muted" style="cursor:pointer;font-size:15px">Where visitors came from (last 7 days)</summary><table><tr><th>Site</th><th class="num">Visits</th></tr>'+A.top_referrers.map(function(r){return '<tr><td>'+esc(r.host)+'</td><td class="num">'+n(r.visits)+'</td></tr>';}).join('')+'</table></details>';}
  } else h+='<p class="na">Not available yet. '+(A&&A.reason==='error'?'The analytics service did not answer on the last try; it will try again automatically.':'Visitor numbers have not been collected yet.')+'</p>';
  h+='</div>';
  // newsletter
  var K=D.kit;
  h+='<div class="card"><div class="ct">Newsletter (The Daily Huddle)</div>';
  if(K&&K.ok){h+='<div class="grid" style="margin-top:10px">'+stat('Confirmed',n(K.confirmed))+stat('Not confirmed yet',n(K.unconfirmed))+stat('New today',n(K.new_today))+stat('New this week',n(K.new_week))+'</div><p class="muted">'+esc(K.note||'')+'</p>';}
  else h+='<p class="na">Not available yet. Newsletter numbers need a read-only key from Kit. Your assistant will walk you through it.</p>';
  h+='</div>';
  // forum
  var F=D.forum;
  h+='<div class="card"><div class="ct">Forum</div><div class="grid" style="margin-top:10px">'+
    stat('Members (including you)',n(F.members),'New today '+n(F.new_today)+' · this week '+n(F.new_week))+
    stat('Fan topics this week',n(F.threads_week),'Today '+n(F.threads_today)+' · all-time '+n(F.threads_total))+
    stat('Fan posts this week',n(F.posts_week),'Today '+n(F.posts_today)+' · all-time '+n(F.posts_total))+
    stat('Fans who posted',n(F.posters_week),'last 7 days')+'</div>';
  if(F.newest&&F.newest.length)h+='<p class="muted">Newest members: '+F.newest.map(function(u){return esc(u.username)+' ('+new Date(u.created).toLocaleDateString('en-US',{timeZone:TZ,month:'short',day:'numeric'})+')';}).join(', ')+'</p>';
  h+='<p class="muted">Counts leave out the automatic Dispatch Desk topics.</p></div>';
  // grades
  var G=D.grades;
  h+='<div class="card"><div class="ct">Player grades from fans</div>';
  if(G.ballot)h+='<p class="muted" style="margin:4px 0">Ballot open now: Week '+esc(G.ballot.week)+' '+esc(G.ballot.game)+'. Voting closes '+when(G.ballot.closes)+'. Fans who graded today: '+n(G.fans_today)+'.</p>';
  if(G.games&&G.games.length){h+='<table><tr><th>Game</th><th class="num">Fans</th><th class="num">Grades given</th></tr>'+G.games.map(function(g){return '<tr><td>Week '+esc(g.week)+' '+esc(String(g.label||'').replace(/^Steelers /,''))+'</td><td class="num">'+n(g.fans)+'</td><td class="num">'+n(g.grades)+'</td></tr>';}).join('')+'</table>';}
  else h+='<p class="na">No finished games with fan grading yet.</p>';
  h+='</div></section>';
  // ---------- HEALTH ----------
  var H=D.health, lv=H.level;
  h+='<section id="health"><h2>Site health <span class="pill '+lv+'">'+(lv==='green'?'All good':lv==='yellow'?'Watch':'Needs a look')+'</span></h2><div class="card"><ul class="check">';
  h+=row(H.loop_running===false?'red':(H.loop_seen_ago_min!=null&&H.loop_seen_ago_min<=45?'green':'red'),'Automatic updater', H.loop_running===false?'Not running.':(H.loop_seen_ago_min==null?'Has not checked in yet.':'Last checked in '+ago(H.stats_updated)+'. It runs about every 11 minutes.'));
  h+=row(H.last_run&&Date.now()-H.last_run<45*60000?'green':'yellow','Last update run',when(H.last_run)+' ('+ago(H.last_run)+')');
  h+=row(H.last_deploy&&Date.now()-H.last_deploy<6*3600000?'green':'yellow','Site last published',when(H.last_deploy)+' ('+ago(H.last_deploy)+'). It only publishes when something changed.');
  if(H.failing&&H.failing.length){H.failing.forEach(function(f){h+=row(f.fails_in_a_row>=3?'red':'yellow','Step having trouble: '+f.step,(f.fails_in_a_row>=3?'Failed '+f.fails_in_a_row+' times in a row. ':'Failed on the last try; it retries automatically. ')+'Last worked '+ago(Date.parse(f.last_ok)));});}
  else h+=row('green','All update steps','Every step worked on the last run.');
  h+=row(H.fresh_ok===false?'red':H.fresh_ok?'green':'yellow','Everything on schedule',H.fresh_ok===false?'Something is overdue; see the checklist above.':H.fresh_ok?'Grades, forum topics, previews and prospect stats are all current.':'Self-check not available.');
  if(H.why&&H.why.length)h+='<li><span class="dot '+lv+'"></span><div><div class="ct">Why</div><div class="cd">'+H.why.map(esc).join('. ')+'.</div></div></li>';
  h+='</ul></div></section>';
  // ---------- ADS ----------
  var AD=D.ads, IQ=D.inbox.ad_inquiries;
  h+='<section id="ads"><h2>Ads</h2><div class="grid">'+stat('Running now',n(AD.running))+stat('Ending in 14 days',n(AD.expiring))+stat('Payments overdue',n(AD.overdue))+stat('Unpaid total',AD.unpaid_total?money(AD.unpaid_total):'$0.00')+'</div>';
  h+='<div class="two" style="margin-top:12px"><div class="card"><div class="top" style="display:flex;justify-content:space-between;align-items:center"><div class="ct">Ad tracker</div><button type="button" class="primary" id="addAd">Add an ad</button></div><div id="adform"></div>';
  h+= AD.list.length? AD.list.map(adRow).join('') : '<p class="na">No ads yet. When you sell an ad, tap "Add an ad" to keep track of dates and payments.</p>';
  h+='</div><div class="card"><div class="ct">Advertising inquiries</div><p class="muted" style="margin:2px 0 6px">From the Contact form when someone picks "Advertising".</p>';
  h+= IQ.length? IQ.map(inqRow).join('') : '<p class="na">No advertising inquiries yet.</p>';
  h+='</div></div></section>';
  h+='<p class="muted" style="text-align:center">Only you can see this page. Signed in with your email code.</p>';
  document.getElementById('app').innerHTML=h;
  if(A&&A.ok)chart('visits');
  bind();
}
function item(c){return '<li><span class="dot '+c.status+'"></span><div><div class="ct">'+(c.link?'<a href="'+esc(c.link)+'"'+(c.link.charAt(0)==='/'?' target="_blank" rel="noopener"':'')+'>'+esc(c.title)+'</a>':esc(c.title))+'</div>'+(c.detail?'<div class="cd">'+esc(c.detail)+'</div>':'')+'</div></li>';}
function row(c,t,d){return '<li><span class="dot '+c+'"></span><div><div class="ct">'+esc(t)+'</div><div class="cd">'+esc(d)+'</div></div></li>';}
function chart(m){
  var days=D.analytics.days.slice(-8), max=Math.max.apply(null,days.map(function(x){return x[m];}).concat([1]));
  document.getElementById('chart').innerHTML='<div class="bars" aria-label="'+m+' per day">'+days.map(function(x,i){var hgt=Math.round(x[m]/max*100);return '<div class="bar'+(i===days.length-1?' today':'')+'"><div class="v">'+n(x[m])+'</div><div class="b" style="height:'+hgt+'%"></div><div class="x">'+(i===days.length-1?'Today':dayLabel(x.date))+'</div></div>';}).join('')+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll('.toggle button'),function(b){b.classList.toggle('on',b.getAttribute('data-m')===m);});
}
function adStatus(a){var t=D.today;if(!a.paid&&a.due_date&&a.due_date<t)return '<span class="pill red">Payment overdue</span>';if(!a.paid&&a.due_date)return '<span class="pill yellow">Unpaid, due '+fmtDate(a.due_date)+'</span>';if(!a.paid&&a.amount)return '<span class="pill yellow">Unpaid</span>';if(a.paid)return '<span class="pill green">Paid</span>';return '';}
function adRow(a){var t=D.today, live=(!a.start_date||a.start_date<=t)&&(!a.end_date||a.end_date>=t), ended=a.end_date&&a.end_date<t;
  return '<div class="adrow"><div class="top"><div><div class="ct">'+esc(a.advertiser)+'</div><div class="cd">'+esc([a.placement,(a.start_date||a.end_date)?((fmtDate(a.start_date)||'?')+' to '+(fmtDate(a.end_date)||'open')):'',a.amount!=null?money(a.amount):''].filter(Boolean).join(' · '))+'</div></div><button type="button" data-edit="'+a.id+'">Edit</button></div>'+
  '<div style="margin-top:6px">'+(ended?'<span class="pill gray">Ended</span> ':live?'<span class="pill green">Running</span> ':'<span class="pill gray">Starts '+fmtDate(a.start_date)+'</span> ')+adStatus(a)+'</div>'+(a.contact?'<div class="cd">Contact: '+esc(a.contact)+'</div>':'')+(a.notes?'<div class="cd">'+esc(a.notes)+'</div>':'')+'</div>';}
function inqRow(m){return '<div class="inq"><div class="ct">'+esc(m.name||'(no name)')+(m.read?' <span class="pill gray">Handled</span>':' <span class="pill yellow">New</span>')+'</div><div class="cd">'+when(m.created)+(m.email?' · <a href="mailto:'+esc(m.email)+'">'+esc(m.email)+'</a>':'')+'</div><p>'+esc(m.body)+'</p><button type="button" data-inq="'+m.id+'" data-h="'+(m.read?0:1)+'">'+(m.read?'Mark as new':'Mark handled')+'</button></div>';}
function form(a){
  a=a||{};
  var f='<form class="ad" id="adf" style="margin:10px 0 14px;padding:12px;border:1px solid var(--line);border-radius:12px"><input type="hidden" name="id" value="'+esc(a.id||'')+'">'+
  '<label for="f-adv">Advertiser</label><input id="f-adv" name="advertiser" required value="'+esc(a.advertiser||'')+'">'+
  '<label for="f-pl">Where the ad shows</label><input id="f-pl" name="placement" placeholder="For example: home page banner, newsletter" value="'+esc(a.placement||'')+'">'+
  '<div class="row"><div><label for="f-s">Start date</label><input id="f-s" type="date" name="start_date" value="'+esc(a.start_date||'')+'"></div><div><label for="f-e">End date</label><input id="f-e" type="date" name="end_date" value="'+esc(a.end_date||'')+'"></div></div>'+
  '<div class="row"><div><label for="f-a">Amount ($)</label><input id="f-a" name="amount" inputmode="decimal" value="'+(a.amount!=null?esc(a.amount):'')+'"></div><div><label for="f-d">Payment due</label><input id="f-d" type="date" name="due_date" value="'+esc(a.due_date||'')+'"></div></div>'+
  '<label class="chk"><input type="checkbox" name="paid"'+(a.paid?' checked':'')+'> Paid</label>'+
  '<label for="f-c">Contact (optional)</label><input id="f-c" name="contact" value="'+esc(a.contact||'')+'">'+
  '<label for="f-n">Notes (optional)</label><textarea id="f-n" name="notes" rows="3">'+esc(a.notes||'')+'</textarea>'+
  '<div class="err" id="aderr"></div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="primary" type="submit">Save</button><button type="button" id="adcancel">Cancel</button>'+(a.id?'<button type="button" class="danger" id="addel">Delete</button>':'')+'</div></form>';
  var box=document.getElementById('adform');box.innerHTML=f;box.scrollIntoView({behavior:'smooth',block:'start'});
  var el=document.getElementById('adf');
  el.addEventListener('submit',function(ev){ev.preventDefault();var fd=new FormData(el),b={};fd.forEach(function(v,k){b[k]=v;});b.paid=!!fd.get('paid');
    api('ads',b).then(function(r){if(r.ok){load();}else document.getElementById('aderr').textContent=r.error==='sign_in_required'?'Your sign-in ended. Tap Refresh to sign in again.':(r.error||'Could not save. Please try again.');});});
  document.getElementById('adcancel').onclick=function(){box.innerHTML='';};
  var del=document.getElementById('addel'); if(del)del.onclick=function(){if(confirm('Delete this ad from the tracker? This cannot be undone.'))api('ads',{action:'delete',id:a.id}).then(function(){load();});};
}
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('.toggle button'),function(b){b.onclick=function(){chart(b.getAttribute('data-m'));};});
  var add=document.getElementById('addAd'); if(add)add.onclick=function(){form();};
  Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){var id=+b.getAttribute('data-edit');form(D.ads.list.filter(function(x){return x.id===id;})[0]);};});
  Array.prototype.forEach.call(document.querySelectorAll('[data-inq]'),function(b){b.onclick=function(){api('inquiry',{id:+b.getAttribute('data-inq'),handled:b.getAttribute('data-h')==='1'}).then(load);};});
}
document.getElementById('refresh').onclick=load;
document.addEventListener('visibilitychange',function(){if(!document.hidden&&D&&Date.now()-D.now>5*60000)load();});
load();
})();
</script>
